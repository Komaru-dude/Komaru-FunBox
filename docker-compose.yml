services:
  db:
    image: postgres:15.17-alpine
    container_name: ${DOCKER_CONTAINER:-komaru}-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - komaru-network

  redis:
    image: redis:8.6-alpine
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - komaru-network

  backup:
    image: postgres:15-alpine
    container_name: ${DOCKER_CONTAINER:-komaru}-backup
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command: >
      -c '
        mkdir -p /backups
        echo "=== Backup service started ==="
        echo "Бэкапы будут сохраняться в /backups каждые 24 часа + при старте"

        while true; do
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          BACKUP_FILE="/backups/funbox_db_${TIMESTAMP}.sql.gz"

          echo "[${TIMESTAMP}] Starting backup of ${DB_NAME}..."

          pg_dump -h ${DB_HOST} -U ${DB_USER} -d ${DB_NAME} --clean --if-exists | gzip > "${BACKUP_FILE}"

          if [ $? -eq 0 ]; then
            SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
            echo "[${TIMESTAMP}] ✅ Backup completed (${SIZE}) → ${BACKUP_FILE}"
          else
            echo "[${TIMESTAMP}] ❌ ERROR: Backup failed!"
          fi

          # Удаляем бэкапы старше 30 дней
          find /backups -name "funbox_db_*.sql.gz" -mtime +30 -delete

          sleep 86400
        done
      '
    networks:
      - komaru-network

  bot:
    build:
      context: .
      args:
        - APP_DIR=/opt/${DOCKER_CONTAINER}
    container_name: ${DOCKER_CONTAINER:-komaru}-bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - .:/opt/${DOCKER_CONTAINER}
    environment:
      - DB_HOST=db
      - DOCKER_CONTAINER=${DOCKER_CONTAINER:-komaru}-bot
    networks:
      - komaru-network

networks:
  komaru-network:
    driver: bridge

volumes:
  postgres_data:
    external: true